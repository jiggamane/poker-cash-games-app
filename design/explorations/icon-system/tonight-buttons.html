<div class="us-shadow"><template shadowrootmode="open"><style>
/* Layout: round two of the review page — two bands, each a short "what changed" brief, a players toggle, and four phones.
   Page chrome stays neutral; the phones carry the look. */
:host{
  --bg:#F3F3F1; --fg:#17171A; --muted:#5E5E66; --line:#DCDCD8; --panel:#FFFFFF; --chip:#EAEAE6; --on:#17171A; --onfg:#FFFFFF;
  --f-head:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:host:not([data-theme="light"]){
  --bg:#0E0E10; --fg:#EDEDEF; --muted:#9A9AA3; --line:#26262B; --panel:#17171A; --chip:#202024; --on:#EDEDEF; --onfg:#111113; color-scheme:dark}}
:host[data-theme="dark"]{--bg:#0E0E10; --fg:#EDEDEF; --muted:#9A9AA3; --line:#26262B; --panel:#17171A; --chip:#202024; --on:#EDEDEF; --onfg:#111113; color-scheme:dark}
*{box-sizing:border-box}:host{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f-body);margin:0}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
header.top h1{font:800 clamp(32px,5vw,52px)/1.02 var(--f-head);letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
header.top p{max-width:70ch;margin:0 0 10px;color:var(--muted)}
header.top p strong{color:var(--fg);font-weight:600}
section.dir{border-top:1px solid var(--line);margin-top:44px;padding-top:34px;scroll-margin-top:16px}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px 48px;align-items:start;margin-bottom:22px}
@media (max-width:860px){.brief{grid-template-columns:minmax(0,1fr)}}
.brief .k{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.brief h2{font:800 clamp(28px,3.4vw,38px)/1.05 var(--f-head);letter-spacing:-.025em;margin:0 0 10px}
.brief .idea{font-size:18px;margin:0 0 16px;max-width:46ch}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--chip);padding:4px 10px 4px 4px;border-radius:999px}
.sw span i{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.changes h3{font:700 14px/1.2 var(--f-body);margin:0 0 8px}
.changes ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px;display:grid;gap:5px}
.changes li strong{color:var(--fg);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 14px}
.toolbar .tl{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{font:600 13px/1 var(--f-body);color:var(--fg);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
.seg button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.toolbar .hint{font-size:13px;color:var(--muted)}
.strip{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x mandatory}
.strip figure{margin:0;flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
.strip figcaption{font:600 13px/1 var(--f-body);color:var(--muted);padding-left:6px}
footer{margin-top:52px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px;max-width:80ch}

/* ───────── Phone shell (shared by every direction) ───────── */
.phone{width:330px;height:760px;border-radius:46px;padding:9px;background:#050506;box-shadow:0 0 0 1px #2a2a2e inset,0 24px 50px -24px rgba(0,0,0,.6);flex:none}
.scr{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--p-bg);color:var(--p-text);font:400 14px/1.35 var(--p-body);-webkit-font-smoothing:antialiased}
.scr *{box-sizing:border-box}
.scr button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:default}
.sb{display:flex;justify-content:space-between;align-items:center;height:42px;padding:8px 28px 0;font:600 13px/1 var(--p-body)}
.sb svg{height:11px;width:auto}
.pad{padding:4px 18px 0}
.ic{width:20px;height:20px;flex:none;display:block}
.ic.s{width:16px;height:16px}.ic.xs{width:13px;height:13px}
.num{font-family:var(--p-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.win{color:var(--p-win)}.loss{color:var(--p-loss)}
.rb{width:36px;height:36px;border-radius:50%;display:grid!important;place-items:center;background:var(--p-raised);flex:none}
.hdr{display:flex;align-items:center;gap:12px}
.hdr h1{margin:0;flex:1;font:var(--p-h1);letter-spacing:var(--p-h1ls,-.02em);font-stretch:var(--p-h1st,100%);text-transform:var(--p-h1tt,none)}
.sub{color:var(--p-muted);font-size:13px;margin:4px 0 0 48px}
.chev{color:var(--p-muted)}

/* Tonight */
.live{display:inline-flex;align-items:center;gap:7px;font:700 13px/1 var(--p-num);padding:8px 12px;border-radius:999px;color:var(--p-win);background:color-mix(in srgb,var(--p-win) 14%,transparent)}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.role{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px 48px;font-size:13px;color:var(--p-muted)}
.role b{color:var(--p-text);font-weight:600}
.role .rb{width:34px;height:34px}
.hero{padding:14px 16px;border-radius:var(--p-r);background:var(--p-surface);position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lbl{font-size:12.5px;color:var(--p-muted);font-weight:500}
.big{font:var(--p-big);letter-spacing:-.03em;margin-top:4px}
.side{text-align:right;color:var(--p-muted);font-size:12px;line-height:1.5;white-space:nowrap}
.stackbar{display:flex;gap:3px;height:8px;margin-top:12px}
.stackbar i{display:block;border-radius:3px;background:var(--pc)}
.seclbl{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--p-body);letter-spacing:.12em;text-transform:uppercase;color:var(--p-muted);margin:14px 0 6px 2px}
.rows{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:11px;height:42px;border-bottom:1px solid var(--p-line)}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;font-weight:600;font-size:15.5px;min-width:0}
.prow .amt{font-weight:700;font-size:16.5px}
.prow .meta{color:var(--p-muted);font-size:12px;font-weight:400;margin-left:6px}
.outrow{display:flex;align-items:center;gap:11px;height:52px;padding:0 12px;border-radius:12px;background:var(--p-surface)}
.outrow .nm{flex:1;min-width:0;font-weight:600;font-size:15.5px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.outrow .meta{color:var(--p-muted);font-size:12px;font-weight:400}
.outrow .amt{font-weight:800;font-size:16.5px}
.dock{position:absolute;left:8px;right:8px;bottom:8px;border-radius:24px 24px 30px 30px;background:var(--p-dock,var(--p-surface));padding:12px 12px 14px}
.dock-h{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font-size:14px}
.dock-h b{font-weight:600;flex:1;color:var(--p-muted)}
.dock-h span{font-size:12px;color:var(--p-muted)}
.dock-b{display:flex;gap:10px}
.btn-pri{flex:1;height:54px;border-radius:16px;display:flex!important;align-items:center;justify-content:center;gap:8px;font-weight:800!important;font-size:18px!important;background:var(--p-pri);color:var(--p-onpri)!important}
.btn-sec{width:94px;height:54px;border-radius:16px;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700!important;font-size:13px!important;box-shadow:inset 0 0 0 2px var(--p-outline)}

/* Avatars: one hook, styled per direction */
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px/1 var(--p-body);position:relative}
.av .su{display:none}

/* Main menu */
.menu .eyebrow{color:var(--p-muted);font-size:13px;margin:22px 0 4px}
.menu h1{font:var(--p-h1);font-size:var(--p-menu-h1,32px);letter-spacing:var(--p-h1ls,-.02em);font-stretch:var(--p-h1st,100%);text-transform:var(--p-h1tt,none);margin:0 0 18px;line-height:1.02}
.cta{position:relative;border-radius:var(--p-r);padding:20px 18px;display:flex;align-items:center;gap:12px;overflow:hidden;min-height:104px}
.cta .t{font:800 21px/1.1 var(--p-body);letter-spacing:-.01em}
.cta .s{font-size:13px;margin-top:6px;opacity:.75}
.cta .go{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{position:relative;border-radius:var(--p-r);padding:14px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;background:var(--p-surface);overflow:hidden}
.tile .tn{font:800 17px/1.15 var(--p-body);letter-spacing:-.01em}
.tile .tx{font-size:11.5px;color:var(--p-muted);margin-top:3px}
.tico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--p-raised)}
.tile .extra{position:absolute;right:12px;top:14px}
.avstack{display:flex;padding-left:7px}.avstack .av{width:22px;height:22px;font-size:9px;margin-left:-7px;box-shadow:0 0 0 2px var(--p-surface)}
.spark{width:64px;height:30px}
.menubar{position:absolute;left:18px;right:18px;bottom:22px;display:flex;gap:10px;align-items:center}
.menubar .pill{display:flex!important;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:999px;background:var(--p-raised);font-weight:700!important;font-size:15px!important}
.menubar .rb{width:44px;height:44px}
.menubar .rb:last-child{margin-left:auto}

/* Boosters */
.blist{display:flex;flex-direction:column}
.brow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--p-line)}
.blist .brow:last-child{border-bottom:0}
.bico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--p-raised)}
.brow .bt{flex:1;min-width:0}
.brow .bn{font-weight:700;font-size:15px}
.brow .bs{font-size:12px;color:var(--p-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Results */
.meta-l{white-space:nowrap;gap:8px;display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px 48px;font-size:13px;color:var(--p-muted)}
.dd{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:var(--p-raised);color:var(--p-text);font-weight:600;font-size:12.5px}
.rrow{display:grid;grid-template-columns:22px 32px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:7px 0}
.rk{font:600 12px/1 var(--p-num);color:var(--p-muted);text-align:center}
.rn{font-weight:600;font-size:15px}
.rg{font-size:11.5px;color:var(--p-muted)}
.rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rnet{font-weight:800;font-size:16.5px}
.terms{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--p-num);color:var(--p-muted);padding:4px 7px;border-radius:7px;background:var(--p-raised)}
.terms .ic{width:11px;height:11px}
.bar{height:3px;border-radius:2px;margin-top:4px;background:var(--p-line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.ded{margin-top:8px;padding-top:10px;border-top:1px solid var(--p-line)}
.ded .h{display:flex;justify-content:space-between;font:700 11px/1 var(--p-body);letter-spacing:.12em;text-transform:uppercase;color:var(--p-muted);margin-bottom:8px}
.ded .h b{letter-spacing:0;font:700 13px/1 var(--p-num);color:var(--p-text)}
.dl{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.dl .w{color:var(--p-muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ended{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 2px;border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line);font-weight:700;font-size:14px}
.ended span{color:var(--p-muted);font-weight:500;display:flex;align-items:center;gap:4px}
.foot{position:absolute;left:16px;right:16px;bottom:18px}
.foot .btn-pri{width:100%}


/* ───────── Round two additions ───────── */
.ri{width:28px;height:28px;flex:none;display:block}
.ri.s{width:18px;height:18px}.ri.xs{width:15px;height:15px}
.av.photo{overflow:hidden;background:#555}
.av.photo svg{width:100%;height:100%;display:block}
.av.photo::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.16),transparent 55%),linear-gradient(transparent 55%,rgba(0,0,0,.2));box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.av.mono{background:var(--p-raised);color:var(--p-muted);font:600 13px/1 var(--p-body)}
.names-only .av,.names-only .avstack{display:none!important}
.rrow{grid-template-columns:32px minmax(0,1fr) auto}
.names-only .rrow{grid-template-columns:minmax(0,1fr) auto}
.names-only .prow,.names-only .outrow{gap:8px}
.tico{width:44px;height:44px;border-radius:12px}
.bico{width:44px;height:44px}
.dock-b .btn-sec .ri{width:22px;height:22px}
.role .rb .ri{width:20px;height:20px}

.outrow .nm{flex-direction:column;align-items:flex-start;gap:2px;line-height:1.15}
.outrow .meta{font-size:11.5px}
.role{white-space:nowrap;font-size:12.5px}
/* Deduction icons on the results stay one quiet tone: the muted text colour, details cut out in the ground behind them */
.terms .ri{--i-body:var(--p-muted);--i-pig:var(--p-muted);--i-acc:var(--p-muted);--i-ink:var(--p-raised)}
.dl .ri{--i-body:var(--p-muted);--i-pig:var(--p-muted);--i-acc:var(--p-muted);--i-ink:var(--p-bg)}
.dl .ri,.d-d2 .dl .ri{opacity:1}

/* Start button: a 3D chip stack on the right, the arrow beside the title */
.cta .stack3d{position:absolute;right:10px;bottom:9px;width:60px;height:74px}
.cta .go{display:none}
.cta .t{white-space:nowrap}
.cta .s{padding-right:70px}
.cta .t .ic{display:inline-block;vertical-align:-2px;margin-left:6px;width:18px;height:18px}
/* ═════════ B2 · CHIP RACK, quieter ═════════ */
.d-b2{--p-bg:#101216;--p-surface:#191C22;--p-raised:#23272F;--p-line:rgba(255,255,255,.065);--p-text:#EDEFF3;--p-muted:#989EAB;
  --p-win:#52C788;--p-loss:#EE6A5F;--p-pri:#D3A24C;--p-onpri:#16120A;--p-outline:#353A45;
  --p-display:'Bricolage Grotesque',system-ui,sans-serif;--p-body:'Plus Jakarta Sans',system-ui,sans-serif;--p-num:'Plus Jakarta Sans',system-ui,sans-serif;
  --p-h1:700 30px/1 'Bricolage Grotesque',system-ui,sans-serif;--p-h1ls:-.025em;--p-big:700 42px/1 'Bricolage Grotesque',system-ui,sans-serif;--p-r:18px;--p-dock:#191C22;
  --i-body:#C5CBD5;--i-mid:#6E7684;--i-dark:#3A404B;--i-metal:#98A1AF;--i-fuse:#C5CBD5;--i-acc:#D3A24C;--i-acc-d:#94702F;--i-acc2:#5E6B82;--i-acc2-d:#414B5D;
  --i-paper:#EEF0F3;--i-cardline:transparent;--i-ink:#1A1D24;--i-red:#C2473E;--i-edge:#8A92A0;--i-pig:#C9A19C;--i-gap:#23272F;--i-btn:#E8B84F;--i-btn-edge:#9C7428}
.d-b2 .stackbar{height:6px;gap:3px}.d-b2 .stackbar i{background:#3B414D;border-radius:3px}
.d-b2 .stackbar i:first-child{background:#59606E}
.d-b2 .seclbl b{font:700 10.5px/1 var(--p-body);letter-spacing:0;color:var(--p-text);background:var(--p-raised);padding:4px 7px;border-radius:999px}
.d-b2 .rows,.d-b2 .blist,.d-b2 .rcard{background:var(--p-surface);border-radius:16px;padding:0 12px}
.d-b2 .rcard{padding:2px 12px}
.d-b2 .rrow{border-bottom:1px solid var(--p-line);padding:8px 0}.d-b2 .rrow:last-child{border-bottom:0}
.d-b2 .outrow{background:color-mix(in srgb,var(--p-win) 8%,var(--p-surface))}
.d-b2 .btn-sec{box-shadow:none;background:var(--p-raised)}
.d-b2 .dock{box-shadow:0 -1px 0 rgba(255,255,255,.06)}
.d-b2 .cta{background:linear-gradient(180deg,#D9AA55,#C9963F);color:#16120A}
.d-b2 .cta .go{background:#16120A;color:#D9AA55}
.d-b2 .tico{background:var(--p-raised)}
.d-b2 .bico{background:var(--p-raised);border-radius:12px}
.d-b2 .bar{height:3px;background:var(--p-raised)}
.d-b2 .dd{background:var(--p-raised)}
.d-b2 .avstack .av{box-shadow:0 0 0 2px var(--p-surface)}

/* ═════════ D2 · FRESH DECK, quieter ═════════ */
.d-d2{--p-bg:#EEF0F3;--p-surface:#FFFFFF;--p-raised:#F1F3F6;--p-line:#E4E7EC;--p-text:#141A2A;--p-muted:#596171;--p-red:#C8283A;
  --p-win:#0E7A45;--p-loss:#4E5768;--p-pri:#141A2A;--p-onpri:#FFFFFF;--p-outline:#141A2A;
  --p-display:'Libre Franklin',system-ui,sans-serif;--p-body:'Inter',system-ui,sans-serif;--p-num:'Libre Franklin',system-ui,sans-serif;
  --p-h1:700 28px/1.05 'Libre Franklin',system-ui,sans-serif;--p-h1ls:-.025em;--p-big:700 40px/1 'Libre Franklin',system-ui,sans-serif;--p-r:14px;--p-dock:#FFFFFF;
  --p-acc:#141A2A;--p-acc-d:#000000;--p-chip:#C8283A;--p-chip-d:#8C1B28;
  --i-body:#141A2A;--i-mid:#8B93A3;--i-dark:#141A2A;--i-metal:#8B93A3;--i-fuse:#141A2A;--i-acc:var(--p-acc);--i-acc-d:var(--p-acc-d);--i-acc2:#141A2A;--i-acc2-d:#000000;
  --i-chip:var(--p-chip);--i-chip-d:var(--p-chip-d);--i-band:var(--p-acc);
  --i-paper:#FFFFFF;--i-cardline:#C5CAD4;--i-ink:#141A2A;--i-red:#C8283A;--i-edge:#A3AAB7;--i-pig:#C9CED8;--i-gap:#F1F3F6}
/* Fresh Deck, locked 20 November. Red belongs to the chips (the start button's stack, the straddle and ante icons)
   and to hearts and diamonds on real cards. Everything else that was red is ink, losses are slate, and nothing points. */
.d-d2 :is(.prow,.outrow,.brow)>.chev,.d-d2 .cta .t .ic{display:none}
/* Start a session is a solid ink button */
.d-d2 .menu .cta{background:#141A2A;color:#fff;box-shadow:0 1px 2px rgba(20,26,42,.25),0 12px 24px -12px rgba(20,26,42,.55)}
.d-d2 .hero,.d-d2 .tile,.d-d2 .outrow,.d-d2 .rows,.d-d2 .blist,.d-d2 .rcard,.d-d2 .cta{background:#fff;box-shadow:0 1px 1.5px rgba(20,26,42,.07),0 8px 20px -12px rgba(20,26,42,.22)}
.d-d2 .rows,.d-d2 .blist{border-radius:var(--p-r);padding:0 12px}
.d-d2 .rcard{border-radius:var(--p-r);padding:2px 12px}
.d-d2 .rrow{border-bottom:1px solid var(--p-line);padding:8px 0}.d-d2 .rrow:last-child{border-bottom:0}
.d-d2 .rb{background:#fff;box-shadow:0 1px 2px rgba(20,26,42,.12)}
/* The bar on Tonight: one segment per seated player, sized by money in. Ink alternates with a mid slate only to part neighbours. */
.d-d2 .stackbar{height:3px;gap:3px}.d-d2 .stackbar i{background:#141A2A;border-radius:1.5px}
.d-d2 .stackbar i:nth-child(even){background:#5A6272}
.d-d2 .seclbl{color:var(--p-text)}
.d-d2 .seclbl .ic{color:var(--p-acc)}
.d-d2 .live{background:rgba(14,122,69,.1)}
.d-d2 .dock{box-shadow:0 -1px 0 var(--p-line),0 -10px 30px -16px rgba(20,26,42,.3)}
.d-d2 .btn-sec{color:var(--p-text);box-shadow:inset 0 0 0 1.5px #C5CAD4}
.d-d2 .btn-pri{font-family:'Libre Franklin',sans-serif!important;font-weight:700!important}
.d-d2 .menu h1{font-size:31px}
.d-d2 .cta .t{font:700 21px/1.1 'Libre Franklin',sans-serif}
.d-d2 .cta .s{color:rgba(255,255,255,.72);opacity:1}
.d-d2 .cta .go{background:var(--p-text);color:#fff}
.d-d2 .idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 15px/1 'Libre Franklin',sans-serif;color:var(--p-text)}
.d-d2 .idx .ic{width:12px;height:12px}
.d-d2 .idx.tl{left:13px;top:13px}.d-d2 .idx.br{right:13px;bottom:13px;transform:rotate(180deg)}
.d-d2 .tile .tn{font:700 16.5px/1.1 'Libre Franklin',sans-serif}
.d-d2 .tico{background:var(--p-raised);border-radius:10px}
.d-d2 .bico{background:var(--p-raised);border-radius:10px}
.d-d2 .brow .bn{font:600 15px/1.2 'Libre Franklin',sans-serif}
.d-d2 .menubar .pill,.d-d2 .menubar .rb{background:#fff;box-shadow:0 1px 2px rgba(20,26,42,.12)}
.d-d2 .terms{background:var(--p-raised)}
.d-d2 .dd{background:#fff;box-shadow:0 1px 2px rgba(20,26,42,.12)}
.d-d2 .ded{border-top:0;margin-top:12px}
.d-d2 .dl .ri{opacity:.95}
.d-d2 .bar{display:none}
.d-d2 .avstack .av{box-shadow:0 0 0 2px #fff}
.d-d2 .hdr h1,.d-d2 .menu h1{font-family:'Libre Franklin',sans-serif}

:host{display:block;background:none!important;color:inherit}
.tbstrip{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 18px}
.tbstrip figure{margin:0;flex:none;display:flex;flex-direction:column;gap:10px}
.tbstrip figcaption{font:500 13px/1.3 'Inter',system-ui,sans-serif;color:#596171;padding-left:6px}.tbstrip figcaption b{color:#141A2A}

.d-d2 .sb{position:relative;z-index:2}
.d-d2 .railp{position:relative;z-index:1;margin:-46px -18px 16px;padding:46px 18px 16px;border-radius:0 0 30px 30px;
  background:radial-gradient(110% 80% at 50% 0%,rgba(20,26,42,.04),transparent 72%),#fff;
  box-shadow:inset 0 -1px 0 #E4E7EC,0 14px 24px -20px rgba(20,26,42,.28)}
.d-d2 .railp .hdr{gap:10px;min-height:36px}
.d-d2 .railp .hdr .rb{width:18px;height:36px;margin-left:-5px;background:none;box-shadow:none;border-radius:0;color:var(--p-muted)}
.d-d2 .railp .hdr .rb svg{width:22px;height:22px}
.d-d2 .railp .hdr h1{font:700 22px/1.1 'Libre Franklin',system-ui,sans-serif;letter-spacing:-.015em}
.d-d2 .railp .sub,.d-d2 .railp .fdsub,.d-d2 .railp .role,.d-d2 .railp .meta-l{margin-left:23px;margin-bottom:0}
.d-d2 .railp .fdsub,.d-d2 .railp .sub{margin-top:0}
.d-d2 .railp .role .rb{background:var(--p-bg);box-shadow:none}
.d-d2 .railp .hero{background:none;box-shadow:none;border-radius:0;padding:14px 2px 2px;margin-top:4px}
.d-d2 .railp.home{padding-bottom:62px;margin-bottom:0}
.d-d2 .railp.home h1{font:700 26px/1.04 'Libre Franklin',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.d-d2 .railp.home + .cta{margin-top:-48px;z-index:2}

.appico{display:inline-flex;flex:none;line-height:0}.terms .appico,.dl .appico{color:var(--p-muted)}.terms .appico{vertical-align:-2px;margin-right:2px}
